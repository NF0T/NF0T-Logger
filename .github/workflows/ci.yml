name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # Linux — Debian Trixie (authoritative platform)
  # Runs inside a Debian Trixie container on the Ubuntu runner host so we test
  # against exactly the same package versions as the maintainer's environment.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux (Debian Trixie)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      # Install git + ca-certificates before checkout — the base Debian image
      # has neither, and actions/checkout needs both to clone over HTTPS.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            g++ cmake ninja-build pkg-config \
            qt6-base-dev \
            libqt6websockets6-dev \
            libqt6sql6-sqlite \
            qtkeychain-qt6-dev \
            libsecret-1-dev \
            libhamlib-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NF0T-Logger-linux
          path: build/bin/NF0T-Logger
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows — MSYS2 UCRT64 (MinGW-w64 GCC on the Universal CRT)
  # All dependencies come from the MSYS2 package repo (pacman). The job name
  # still says MinGW64: it is a required status check on main and develop, and
  # renaming it would block every PR until branch protection is updated.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows (MSYS2 MinGW64)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # libmariadbclient: client library for Qt's MariaDB/MySQL SQL driver
          # (the MariaDB backend). Comments cannot go inside the folded list.
          pacboy: >-
            gcc:p
            cmake:p
            ninja:p
            pkgconf:p
            qt6-base:p
            qt6-websockets:p
            qtkeychain-qt6:p
            libmariadbclient:p

      - name: Configure
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Test
        shell: msys2 {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      # Install to a staging directory, then start both programs with only the
      # Windows system directories on PATH, as on a PC without MSYS2. A missing
      # DLL makes Windows refuse to start the process (0xC0000135). The
      # v26.11.3 installer shipped exactly that way, and nothing caught it.
      - name: Stage install
        shell: msys2 {0}
        run: cmake --install build --prefix stage

      - name: Smoke test the staged install (system-only PATH)
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $m = Start-Process stage\bin\log4om-migrate.exe -ArgumentList '--help' -PassThru -Wait -NoNewWindow
          if ($m.ExitCode -ne 0) { throw ("log4om-migrate failed to start: 0x{0:X8}" -f $m.ExitCode) }
          $g = Start-Process stage\bin\NF0T-Logger.exe -PassThru
          Start-Sleep -Seconds 10
          if ($g.HasExited) { throw ("NF0T-Logger exited early: 0x{0:X8}" -f $g.ExitCode) }
          Stop-Process $g -Force
          "Deployed DLLs: " + (Get-ChildItem stage\bin -Recurse -Filter *.dll).Count

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NF0T-Logger-windows
          # The staged install: self-contained and runnable on any Windows PC.
          path: stage/bin/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS — Apple Silicon (Homebrew)
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: brew install cmake ninja qt qtkeychain hamlib

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix qt);$(brew --prefix qtkeychain);$(brew --prefix hamlib)"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NF0T-Logger-macos
          path: build/bin/NF0T-Logger
          if-no-files-found: error
