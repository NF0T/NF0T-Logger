name: Release

# Triggered by the version bump landing on main, not by a tag push. GitHub's
# Immutable Releases feature permanently locks a release's assets the instant
# it's published, with no exceptions — so a tag-push trigger is a trap: the
# only way to create a tag through the GitHub Release UI/API is to publish,
# and by then it's too late to attach anything. This workflow owns the whole
# sequence itself (build -> sign -> upload -> publish, in that order) so
# there is no manual "push a tag" or "publish the draft" step left for a
# human to get wrong. See detect-version below for how it avoids re-releasing
# on every ordinary push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:

  # ---------------------------------------------------------------------------
  # Only proceed if this push actually bumped CalVer past the last tag —
  # every other push to main (CI-only fixes, etc.) is a no-op here.
  # ---------------------------------------------------------------------------
  detect-version:
    name: Detect New Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Check for a new CalVer version
        id: check
        run: |
          VERSION=$(grep -m1 '^\s*VERSION [0-9]' CMakeLists.txt | grep -oP '\d+\.\d+\.\d+(\.\d+)?')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already tagged — nothing to release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is new — releasing"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Windows — MSYS2 MinGW64 NSIS installer
  # ---------------------------------------------------------------------------
  package-windows:
    name: Windows NSIS Installer
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          pacboy: >-
            gcc:p
            cmake:p
            ninja:p
            pkgconf:p
            qt6-base:p
            qt6-websockets:p
            qt6-tools:p
            qtkeychain-qt6:p
            nsis:p

      - name: Configure
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Package (NSIS)
        shell: msys2 {0}
        run: cd build && cpack -G NSIS

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-installer
          path: build/NF0T-Logger-*-win64.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux — Debian Trixie (Qt 6.8, same environment as CI)
  # ---------------------------------------------------------------------------
  package-linux:
    name: Linux AppImage
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Install git and ca-certificates
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git wget

      - uses: actions/checkout@v6.0.2

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            g++ cmake ninja-build pkg-config file \
            qt6-base-dev libqt6websockets6-dev qt6-tools-dev-tools \
            qtkeychain-qt6-dev libsecret-1-dev libhamlib-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Install into AppDir
        run: cmake --install build --prefix AppDir/usr

      - name: Download linuxdeploy + Qt plugin
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          LINUXDEPLOY_OUTPUT_VERSION: ${{ needs.detect-version.outputs.version }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          export LINUXDEPLOY_OUTPUT_VERSION
          export QMAKE=$(which qmake6 2>/dev/null || find /usr -name qmake6 2>/dev/null | head -1)
          echo "Using qmake6: $QMAKE"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/NF0T-Logger \
            --plugin qt \
            --output appimage
          find . -maxdepth 1 -name "NF0T*Logger*.AppImage" | head -1 \
            | xargs -I{} mv {} NF0T-Logger-${LINUXDEPLOY_OUTPUT_VERSION}-x86_64.AppImage

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-appimage
          path: NF0T-Logger-*-x86_64.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Sign both artifacts and attach to GitHub release
  # ---------------------------------------------------------------------------
  sign-and-upload:
    name: Sign and Upload to Release
    needs: [detect-version, package-windows, package-linux]
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Import GPG signing key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Sign artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for f in NF0T-Logger-*.exe NF0T-Logger-*.AppImage; do
            [ -f "$f" ] || continue
            gpg --batch --yes \
              --passphrase-fd 0 \
              --pinentry-mode loopback \
              --detach-sign --armor "$f" \
              <<< "$GPG_PASSPHRASE"
          done

      - name: Attach assets to the draft release, then publish last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.detect-version.outputs.version }}
        run: |
          # release-drafter normally already has a draft for this tag; create
          # one if it somehow doesn't. Either way this release must still be a
          # draft at this point — nothing upstream of this job is permitted to
          # publish it first.
          if gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft > /tmp/is_draft 2>/dev/null; then
            if [ "$(cat /tmp/is_draft)" != "true" ]; then
              echo "::error::$TAG is already published — its assets are permanently immutable and this job cannot attach anything to it. Someone/something published it before this job could upload. Delete and recreate the release for $TAG, then fix whatever published it early." >&2
              exit 1
            fi
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --draft \
              --title "$TAG" \
              --generate-notes
          fi

          # Safe: uploading to a still-draft release is always allowed.
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            NF0T-Logger-*.exe \
            NF0T-Logger-*.exe.asc \
            NF0T-Logger-*.AppImage \
            NF0T-Logger-*.AppImage.asc

          # Publish LAST, only now that assets are confirmed attached. This is
          # the only place in the whole pipeline allowed to flip draft off —
          # never do this by hand from the GitHub UI or CLI.
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
